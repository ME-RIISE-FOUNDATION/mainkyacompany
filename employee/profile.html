<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile — ME-RIISE FOUNDATION</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link href="../assets/css/style.css" rel="stylesheet">
</head>
<body>
<div class="tbi-wrapper">
  <div id="sidebarContainer"></div>
  <div class="tbi-main-wrap">
    <div id="topbarContainer"></div>
    <main class="tbi-content" id="pageContent"></main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  await TBI.ready();
  if (!renderShell('My Profile')) return;

  const session = Auth.getSession();
  const myEmpId = session.employee_id;
  const emp     = DB.findOne('employees', 'Employee_ID', myEmpId) || {};
  const user    = DB.findOne('users', 'Employee_ID', myEmpId)     || {};
  const tasks   = DB.findMany('tasks', 'Employee_ID', myEmpId);
  const stats   = Utils.employeeStats(tasks, myEmpId);
  const ini     = Utils.initials(emp.Name || '');
  const pctCl   = Utils.pctColor(stats.completionPct);

  document.getElementById('pageContent').innerHTML = `
    <h4 class="fw-700 mb-4"><i class="bi bi-person-circle me-2 text-primary"></i>My Profile</h4>

    <div class="row g-4">
      <div class="col-md-4">
        <div class="card border-0 shadow-sm text-center">
          <div class="card-body py-4">
            ${emp.Photo_URL
              ? `<img src="${Utils.esc(emp.Photo_URL)}" alt="Profile" class="rounded-circle mb-3" width="100" height="100" style="object-fit:cover;border:3px solid var(--glass-bd2)">`
              : `<div class="emp-avatar-initials mx-auto mb-3" style="width:100px;height:100px;font-size:1.8rem">${Utils.esc(ini)}</div>`}
            <h5 class="fw-700 mb-1">${Utils.esc(emp.Name||'')}</h5>
            <div class="mb-1">${Utils.leaveBadge(emp)}</div>
            <div class="text-muted mb-1">${Utils.esc(emp.Designation||'')}</div>
            <div class="text-muted small">${Utils.esc(emp.Email||'')}</div>
            ${emp.Phone?`<div class="text-muted small">${Utils.esc(emp.Phone)}</div>`:''}
            <hr class="my-3">
            <div class="row g-2 text-center mb-3">
              <div class="col-4"><div class="fw-700 text-primary">${stats.total}</div><div class="text-muted" style="font-size:.7rem">Total</div></div>
              <div class="col-4"><div class="fw-700 text-success">${stats.approved}</div><div class="text-muted" style="font-size:.7rem">Approved</div></div>
              <div class="col-4"><div class="fw-700 text-purple">${stats.completionPct}%</div><div class="text-muted" style="font-size:.7rem">Rate</div></div>
            </div>
            <div class="progress" style="height:7px"><div class="progress-bar bg-${pctCl}" style="width:${stats.completionPct}%"></div></div>
            <div class="text-muted small mt-1">Completion Rate</div>
          </div>
        </div>
      </div>

      <div class="col-md-8">
        <div class="card border-0 shadow-sm mb-4">
          <div class="card-header fw-600"><i class="bi bi-info-circle me-2"></i>Employee Information</div>
          <div class="card-body">
            <div class="row g-3">
              <div class="col-sm-6"><div class="text-muted small">Employee ID</div><div class="fw-500">${Utils.esc(emp.Employee_ID||'—')}</div></div>
              <div class="col-sm-6"><div class="text-muted small">Designation</div><div class="fw-500">${Utils.esc(emp.Designation||'—')}</div></div>
              <div class="col-sm-6"><div class="text-muted small">Email</div><div class="fw-500">${Utils.esc(emp.Email||'—')}</div></div>
              <div class="col-sm-6"><div class="text-muted small">Phone</div><div class="fw-500">${Utils.esc(emp.Phone||'—')}</div></div>
              <div class="col-sm-6"><div class="text-muted small">Username</div><div class="fw-500"><code>${Utils.esc(user.Username||'—')}</code></div></div>
              <div class="col-sm-6"><div class="text-muted small">Availability</div><div class="fw-500">${emp.Status==='On Leave'?'On Leave':'Active'} ${Utils.leaveBadge(emp)}</div></div>
            </div>
          </div>
        </div>

        <div class="card border-0 shadow-sm mb-4">
          <div class="card-header fw-600"><i class="bi bi-pencil-square me-2"></i>Update My Details</div>
          <div class="card-body">
            <div id="detailsAlert"></div>
            <div class="row g-3">
              <div class="col-sm-6">
                <label class="form-label small">Phone</label>
                <input type="tel" class="form-control" id="editPhone" value="${Utils.esc(emp.Phone||'')}" placeholder="+91 XXXXX XXXXX">
              </div>
              <div class="col-12">
                <label class="form-label small">Profile Picture</label>
                <div class="d-flex align-items-center gap-3">
                  <img id="editPhotoPreview" src="${Utils.esc(emp.Photo_URL||'')}" alt="" class="rounded-circle" width="56" height="56" style="object-fit:cover;border:2px solid var(--glass-bd2);${emp.Photo_URL?'':'display:none'}">
                  <div class="flex-fill">
                    <input type="file" accept="image/*" class="form-control form-control-sm mb-2" id="editPhotoFile" onchange="pickPhoto('editPhotoFile','editPhotoPreview','editPhotoData','editPhoto')">
                    <input type="url" class="form-control form-control-sm" id="editPhoto" value="${(emp.Photo_URL||'').startsWith('data:')?'':Utils.esc(emp.Photo_URL||'')}" placeholder="…or paste an image URL" oninput="document.getElementById('editPhotoData').value=''">
                  </div>
                </div>
                <input type="hidden" id="editPhotoData" value="${Utils.esc(emp.Photo_URL||'')}">
              </div>
              <div class="col-sm-6">
                <label class="form-label small">Availability</label>
                <select class="form-select" id="editStatus">
                  <option value="Active" ${emp.Status!=='On Leave'?'selected':''}>Active</option>
                  <option value="On Leave" ${emp.Status==='On Leave'?'selected':''}>On Leave</option>
                </select>
                <div class="form-text">Set “On Leave” when you are away — it shows on the admin dashboards.</div>
              </div>
            </div>
            <button type="button" class="btn btn-primary mt-3" onclick="saveMyDetails()"><i class="bi bi-save me-1"></i>Save Details</button>
          </div>
        </div>

        <div class="card border-0 shadow-sm">
          <div class="card-header fw-600"><i class="bi bi-shield-lock me-2"></i>Change Password</div>
          <div class="card-body">
            <div id="pwdAlert"></div>
            <div class="row g-3">
              <div class="col-12">
                <label class="form-label small">Current Password</label>
                <input type="password" class="form-control" id="currentPwd" required>
              </div>
              <div class="col-sm-6">
                <label class="form-label small">New Password</label>
                <input type="password" class="form-control" id="newPwd" minlength="8" required>
              </div>
              <div class="col-sm-6">
                <label class="form-label small">Confirm New Password</label>
                <input type="password" class="form-control" id="confirmPwd" minlength="8" required>
              </div>
            </div>
            <button type="button" class="btn btn-primary mt-3" onclick="changePassword()">Update Password</button>
          </div>
        </div>
      </div>
    </div>
  `;
});

async function saveMyDetails() {
  const session = Auth.getSession();
  const emp     = DB.findOne('employees', 'Employee_ID', session.employee_id);
  const alertEl = document.getElementById('detailsAlert');
  if (!emp) {
    alertEl.innerHTML = `<div class="alert alert-danger py-2 small mb-3">Your employee record could not be found.</div>`; return;
  }
  const phone  = document.getElementById('editPhone').value.trim();
  const photo  = document.getElementById('editPhotoData').value || document.getElementById('editPhoto').value.trim();
  const status = document.getElementById('editStatus').value;
  DB.updateById('employees', 'Employee_ID', session.employee_id, {Phone: phone, Photo_URL: photo, Status: status});
  setFlash('success', status === 'On Leave' ? 'Details saved — you are marked On Leave.' : 'Profile details updated.');
  await API.flush();
  location.reload();
}

async function changePassword() {
  const session = Auth.getSession();
  const user    = DB.findOne('users', 'Employee_ID', session.employee_id);
  const current = document.getElementById('currentPwd').value;
  const newPwd  = document.getElementById('newPwd').value;
  const confirm = document.getElementById('confirmPwd').value;
  const alertEl = document.getElementById('pwdAlert');

  if (!user) {
    alertEl.innerHTML = `<div class="alert alert-danger py-2 small mb-3">Your account could not be found.</div>`; return;
  }
  if (newPwd.length < 8) {
    alertEl.innerHTML = `<div class="alert alert-danger py-2 small mb-3">New password must be at least 8 characters.</div>`; return;
  }
  if (newPwd !== confirm) {
    alertEl.innerHTML = `<div class="alert alert-danger py-2 small mb-3">New passwords do not match.</div>`; return;
  }
  // The current password is verified server-side against the bcrypt hash.
  const r = await API.setPassword(user.Username, newPwd, current);
  if (!r || !r.ok) {
    alertEl.innerHTML = `<div class="alert alert-danger py-2 small mb-3">${(r && r.error) || 'Could not change password (server offline).'}</div>`; return;
  }
  alertEl.innerHTML = `<div class="alert alert-success py-2 small mb-3">Password changed successfully.</div>`;
  document.getElementById('currentPwd').value = '';
  document.getElementById('newPwd').value = '';
  document.getElementById('confirmPwd').value = '';
}
</script>
</body>
</html>
