<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Dashboard — ME-RIISE FOUNDATION</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link href="../assets/css/style.css" rel="stylesheet">
</head>
<body>
<div class="tbi-wrapper">
  <div id="sidebarContainer"></div>
  <div class="tbi-main-wrap">
    <div id="topbarContainer"></div>
    <main class="tbi-content" id="pageContent"></main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  await TBI.ready();
  if (!renderShell('My Dashboard')) return;
  TBI.autoReloadOnSync();   // refresh when another dashboard changes the data

  const session  = Auth.getSession();
  const myEmpId  = session.employee_id;
  const allTasks = DB.findMany('tasks', 'Employee_ID', myEmpId);
  const notifs   = DB.findMany('notifications', 'User_ID', myEmpId);
  const unread   = notifs.filter(n => n.Read_Status === 'unread');

  const overdueTasks = allTasks.filter(t => Utils.isOverdue(t.Deadline, t.Status));
  const stats        = Utils.employeeStats(allTasks, myEmpId);

  // Urgent list — overdue + high priority pending, deduped
  const urgentMap = {};
  overdueTasks.forEach(t => { urgentMap[t.Task_ID] = t; });
  allTasks.filter(t => t.Priority==='High' && ['Pending','In Progress'].includes(t.Status)).forEach(t => {
    if (!urgentMap[t.Task_ID]) urgentMap[t.Task_ID] = t;
  });
  const urgent = Object.values(urgentMap).sort((a,b) => (a.Deadline||'').localeCompare(b.Deadline||'')).slice(0,6);

  const today = new Date().toLocaleDateString('en-US',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

  const urgentItems = urgent.length ? urgent.map(t => {
    const od = Utils.isOverdue(t.Deadline, t.Status);
    return `
      <div class="list-group-item d-flex align-items-start gap-3 py-2 px-3">
        <div class="flex-fill min-w-0">
          <div class="fw-500 small text-truncate">${Utils.esc(t.Task_Title)}</div>
          <div class="d-flex flex-wrap gap-1 mt-1">
            ${Utils.priorityBadge(t.Priority)} ${Utils.statusBadge(t.Status)}
            ${od?`<span class="badge bg-danger">${Utils.daysPending(t.Deadline)}d overdue</span>`:''}
          </div>
        </div>
        <div class="text-end small text-muted flex-shrink-0 pt-1">${Utils.formatDate(t.Deadline)}</div>
      </div>`;
  }).join('') : `<div class="list-group-item text-center text-muted py-4"><i class="bi bi-check2-circle text-success fs-4 d-block mb-1"></i>All clear — no urgent tasks!</div>`;

  const recent = allTasks.slice().reverse().slice(0,8);
  const recentRows = recent.length ? recent.map(t => {
    const od = Utils.isOverdue(t.Deadline, t.Status);
    return `<tr class="${od?'table-danger':''}">
      <td>
        <div class="fw-500 small">${Utils.esc(t.Task_Title)}</div>
        ${t.Description?`<div class="text-muted" style="font-size:.7rem">${Utils.esc(t.Description.length>60?t.Description.slice(0,60)+'…':t.Description)}</div>`:''}
      </td>
      <td>${Utils.priorityBadge(t.Priority)}</td>
      <td class="small ${od?'text-danger fw-600':''}">${Utils.formatDate(t.Deadline)}</td>
      <td>${Utils.statusBadge(t.Status)}</td>
    </tr>`;
  }).join('') : `<tr><td colspan="4" class="text-center text-muted py-4"><i class="bi bi-inbox d-block fs-4 mb-1"></i>No tasks assigned yet</td></tr>`;

  const recentNotifs = notifs.slice(-10).reverse();
  const notifItems = recentNotifs.length ? recentNotifs.map(n => {
    const isNew = n.Read_Status === 'unread';
    const icon  = {task_assigned:'bi-list-task text-primary',approval_result:'bi-check2-circle text-success'}[n.Type]||'bi-bell text-muted';
    return `
      <div class="list-group-item d-flex align-items-center gap-3 py-2 notif-item ${isNew?'notif-unread':''}">
        <i class="bi ${icon} fs-5 flex-shrink-0"></i>
        <div class="flex-fill">
          <div class="small ${isNew?'fw-600':''}">${Utils.esc(n.Message)}</div>
          <div class="text-muted" style="font-size:.7rem">${Utils.formatDate(n.Created_At)}</div>
        </div>
        ${isNew?'<span class="badge bg-primary rounded-pill flex-shrink-0">New</span>':''}
      </div>`;
  }).join('') : `<div class="list-group-item text-center text-muted py-4"><i class="bi bi-bell-slash d-block fs-4 mb-1"></i>No notifications yet</div>`;

  document.getElementById('pageContent').innerHTML = `
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
      <div>
        <h4 class="fw-700 mb-0"><i class="bi bi-grid-fill me-2 text-primary"></i>My Dashboard</h4>
        <small class="text-muted">${Utils.esc(session.name)} &bull; ${Utils.esc(session.designation)} &bull; ${Utils.esc(today)}</small>
      </div>
      <a href="tasks.html" class="btn btn-primary btn-sm"><i class="bi bi-list-task me-1"></i>My Tasks</a>
    </div>

    <div id="attendanceCard">${attendanceCardHTML()}</div>

    <div class="row g-3 mb-4">
      <div class="col-6 col-sm-4 col-lg-2"><div class="stat-card border-start border-primary border-4 text-center"><div class="stat-icon text-primary"><i class="bi bi-list-task"></i></div><div class="stat-val text-primary">${stats.total}</div><div class="stat-lbl">Total</div></div></div>
      <div class="col-6 col-sm-4 col-lg-2"><div class="stat-card border-start border-success border-4 text-center"><div class="stat-icon text-success"><i class="bi bi-check2-all"></i></div><div class="stat-val text-success">${stats.approved}</div><div class="stat-lbl">Approved</div></div></div>
      <div class="col-6 col-sm-4 col-lg-2"><div class="stat-card border-start border-info border-4 text-center"><div class="stat-icon text-info"><i class="bi bi-hourglass-split"></i></div><div class="stat-val text-info">${stats.completed}</div><div class="stat-lbl">Completed</div></div></div>
      <div class="col-6 col-sm-4 col-lg-2"><div class="stat-card border-start border-warning border-4 text-center"><div class="stat-icon text-warning"><i class="bi bi-clock"></i></div><div class="stat-val text-warning">${stats.pending}</div><div class="stat-lbl">Pending</div></div></div>
      <div class="col-6 col-sm-4 col-lg-2"><div class="stat-card border-start border-danger border-4 text-center"><div class="stat-icon text-danger"><i class="bi bi-exclamation-triangle"></i></div><div class="stat-val text-danger">${stats.overdue}</div><div class="stat-lbl">Overdue</div></div></div>
      <div class="col-6 col-sm-4 col-lg-2"><div class="stat-card border-start border-4 text-center" style="border-left-color:var(--c-purple)!important"><div class="stat-icon text-purple"><i class="bi bi-graph-up"></i></div><div class="stat-val text-purple">${stats.completionPct}%</div><div class="stat-lbl">Completion %</div></div></div>
    </div>

    ${unread.length>0?`<div class="alert alert-info d-flex align-items-center gap-2 mb-3"><i class="bi bi-bell-fill fs-5 flex-shrink-0"></i><div>You have <strong>${unread.length}</strong> unread notification${unread.length>1?'s':''}. <a href="#notifSection" class="alert-link">View below</a></div></div>`:''}
    ${overdueTasks.length>0?`<div class="alert alert-danger d-flex align-items-center gap-2 mb-3"><i class="bi bi-exclamation-triangle-fill fs-5 flex-shrink-0"></i><div><strong>${overdueTasks.length} overdue task${overdueTasks.length>1?'s':''}</strong> need immediate attention! <a href="tasks.html?tab=overdue" class="alert-link">View overdue</a></div></div>`:''}

    <div class="row g-3 mb-4">
      <div class="col-md-4 mb-3 mb-md-0">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-header fw-600"><i class="bi bi-pie-chart-fill me-2 text-primary"></i>Task Overview</div>
          <div class="card-body d-flex align-items-center justify-content-center" style="height:240px;position:relative">
            ${stats.total>0?'<canvas id="myTaskChart"></canvas>':'<div class="text-center text-muted"><i class="bi bi-inbox fs-1 d-block mb-2"></i><span class="small">No tasks yet</span></div>'}
          </div>
        </div>
      </div>
      <div class="col-md-8">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-header d-flex justify-content-between align-items-center">
            <span class="fw-600"><i class="bi bi-exclamation-circle text-danger me-2"></i>Priority &amp; Overdue Tasks</span>
            <a href="tasks.html" class="btn btn-sm btn-outline-primary">View All</a>
          </div>
          <div class="card-body p-0">
            <div class="list-group list-group-flush">${urgentItems}</div>
          </div>
        </div>
      </div>
    </div>

    <div class="card border-0 shadow-sm mb-4">
      <div class="card-header d-flex justify-content-between align-items-center">
        <span class="fw-600"><i class="bi bi-clock-history me-2"></i>Recent Assignments</span>
        <a href="tasks.html" class="btn btn-sm btn-outline-primary">All Tasks</a>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover mb-0">
            <thead class="table-light"><tr><th>Task</th><th>Priority</th><th>Deadline</th><th>Status</th></tr></thead>
            <tbody>${recentRows}</tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="card border-0 shadow-sm" id="notifSection">
      <div class="card-header fw-600">
        <i class="bi bi-bell me-2"></i>Notifications
        ${unread.length>0?`<span class="badge bg-danger ms-1">${unread.length}</span>`:''}
      </div>
      <div class="list-group list-group-flush">${notifItems}</div>
    </div>
  `;

  renderAttendance();

  if (stats.total > 0) {
    new Chart(document.getElementById('myTaskChart'), {
      type:'doughnut',
      data:{
        labels:['Approved','In Progress','Pending','Rejected'],
        datasets:[{data:[stats.approved, allTasks.filter(t=>t.Status==='In Progress').length, allTasks.filter(t=>t.Status==='Pending').length, stats.rejected],backgroundColor:['#4ade80','#60a5fa','#facc15','#f87171'],borderColor:'rgba(255,255,255,0.08)',borderWidth:2}]
      },
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{boxWidth:10,padding:10}}}}
    });
  }
});

// ── Attendance card (check-in / check-out) ────────────────────
function attendanceCardHTML() {
  const s   = Auth.getSession();
  const rec = Attendance.getToday(s.employee_id) || {};
  const fmt = t => t ? t.slice(11) : '—';
  const checkedIn  = !!rec.Check_In;
  const checkedOut = !!rec.Check_Out;
  const worked     = Attendance.workedHours(rec);
  const statusBadge = checkedOut
    ? '<span class="badge bg-secondary">Day ended</span>'
    : checkedIn ? '<span class="badge bg-success">Working</span>'
    : '<span class="badge bg-warning">Not checked in</span>';
  return `
    <div class="card border-0 shadow-sm mb-4">
      <div class="card-body">
        <div class="d-flex flex-wrap align-items-center justify-content-between gap-3">
          <div class="d-flex flex-wrap align-items-center gap-4">
            <div class="fw-700"><i class="bi bi-clock-history me-2 text-primary"></i>Attendance ${statusBadge}</div>
            <div><div class="small text-muted">Login Time</div><div class="fw-600"><i class="bi bi-box-arrow-in-right me-1 text-primary"></i>${fmt(rec.Login_Time)}</div></div>
            <div><div class="small text-muted">Check In</div><div class="fw-600"><i class="bi bi-clock me-1 text-success"></i>${fmt(rec.Check_In)}</div></div>
            <div><div class="small text-muted">Check Out</div><div class="fw-600"><i class="bi bi-clock-history me-1 text-danger"></i>${fmt(rec.Check_Out)}</div></div>
            <div><div class="small text-muted">Worked</div><div class="fw-600"><i class="bi bi-hourglass-split me-1 text-warning"></i>${worked}</div></div>
          </div>
          <div class="d-flex gap-2">
            <button class="btn btn-success btn-sm" onclick="doCheckIn()" ${checkedIn?'disabled':''}><i class="bi bi-box-arrow-in-right me-1"></i>${checkedIn?'Checked In':'Check In'}</button>
            <button class="btn btn-danger btn-sm" onclick="doCheckOut()" ${(!checkedIn||checkedOut)?'disabled':''}><i class="bi bi-box-arrow-right me-1"></i>${checkedOut?'Checked Out':'Check Out'}</button>
          </div>
        </div>
      </div>
    </div>`;
}
function renderAttendance() { const el = document.getElementById('attendanceCard'); if (el) el.innerHTML = attendanceCardHTML(); }
function doCheckIn()  { Attendance.checkIn(Auth.getSession().employee_id);  renderAttendance(); showFlash('success', 'Checked in successfully.'); }
function doCheckOut() { Attendance.checkOut(Auth.getSession().employee_id); renderAttendance(); showFlash('success', 'Checked out successfully.'); }
</script>
</body>
</html>
