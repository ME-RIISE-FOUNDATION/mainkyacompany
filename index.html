<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — ME-RIISE FOUNDATION</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">

    <div class="auth-header">
      <!-- Place the provided login logo at assets/images/logo-login.png -->
      <!-- <img src="assets/images/logo-login.png" alt="ME-RIISE FOUNDATION" class="auth-logo" onerror="this.onerror=null;this.src='assets/images/logo.svg';"> -->
      <div class="auth-title">ME-RIISE FOUNDATION</div>
      <!-- <div class="auth-sub">Malnad College of Engineering</div> -->
    </div>

    <div class="auth-body">
      <h5 class="fw-600 mb-4 text-center" style="color:var(--t2)">Sign in to Task Manager</h5>

      <div id="alertArea"></div>

      <div class="mb-3">
        <label class="form-label">Username</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input type="text" class="form-control" id="username" placeholder="Enter your username" required autofocus>
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label">Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
          <button class="btn btn-outline-secondary" type="button" id="pwdToggle">
            <i class="bi bi-eye" id="pwdEye"></i>
          </button>
        </div>
      </div>

      <button type="button" class="btn btn-primary w-100 py-2 fw-600" id="loginBtn">
        <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
      </button>

      <hr class="my-4">
      <div class="text-center small text-muted">
        <i class="bi bi-shield-check me-1" style="color:var(--c-success)"></i>
        Secure login · Session-encrypted
      </div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/app.js"></script>
<script>
  // Pull the shared dataset (users, etc.) from the server before any login
  const _ready = TBI.ready();

  // Redirect if already logged in
  if (Auth.isLoggedIn()) {
    window.location.href = Auth.isAdmin() ? 'admin/dashboard.html' : 'employee/dashboard.html';
  }

  document.getElementById('pwdToggle').addEventListener('click', () => {
    const f = document.getElementById('password');
    const e = document.getElementById('pwdEye');
    if (f.type === 'password') { f.type = 'text'; e.className = 'bi bi-eye-slash'; }
    else { f.type = 'password'; e.className = 'bi bi-eye'; }
  });

  async function doLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const area     = document.getElementById('alertArea');

    if (!username || !password) {
      area.innerHTML = `<div class="alert alert-danger py-2"><i class="bi bi-exclamation-circle me-1"></i>Please enter username and password.</div>`;
      return;
    }
    // Auth is server-side now, so login no longer waits for the full bootstrap.
    if (await Auth.login(username, password)) {
      window.location.href = Auth.isAdmin() ? 'admin/dashboard.html' : 'employee/dashboard.html';
    } else {
      area.innerHTML = `<div class="alert alert-danger py-2"><i class="bi bi-exclamation-circle me-1"></i>Invalid username or password.</div>`;
    }
  }

  document.getElementById('loginBtn').addEventListener('click', doLogin);
  document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  document.getElementById('username').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('password').focus(); });
</script>
</body>
</html>
