<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — ME-RIISE FOUNDATION</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link href="../assets/css/style.css" rel="stylesheet">
</head>
<body>
<div class="tbi-wrapper">
  <div id="sidebarContainer"></div>
  <div class="tbi-main-wrap">
    <div id="topbarContainer"></div>
    <main class="tbi-content" id="pageContent"></main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  await TBI.ready();
  if (!renderShell('Admin Dashboard', true)) return;
  TBI.autoReloadOnSync();   // refresh when another dashboard changes the data

  const session   = Auth.getSession();
  const tasks     = DB.getAll('tasks');
  const employees = staffOnly(DB.getAll('employees'));   // the CEO is the head/admin, not shown as staff
  const approvals = DB.getAll('approvals');

  const totalTasks       = tasks.length;
  const approvedTasks    = tasks.filter(t => t.Status === 'Approved').length;
  const completedTasks   = tasks.filter(t => ['Completed','Approved'].includes(t.Status)).length;
  const pendingTasks     = tasks.filter(t => ['Pending','In Progress'].includes(t.Status)).length;
  const overdueTasks     = tasks.filter(t => Utils.isOverdue(t.Deadline, t.Status)).length;
  const pendingApprovals = approvals.filter(a => a.Status === 'Pending').length;

  // Sort employees
  const order = ['CEO','COO','TBI Manager','Programme Associate/Outreach officer','Software Associate','Finance Associate','Innovation Associate','Support Staff'];
  employees.sort((a,b) => {
    const ai = order.indexOf(a.Designation); const bi = order.indexOf(b.Designation);
    return (ai<0?99:ai) - (bi<0?99:bi);
  });

  const today = new Date().toLocaleDateString('en-US',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

  // Employee cards
  const empCards = employees.map(emp => {
    const stats = Utils.employeeStats(tasks, emp.Employee_ID);
    const ini   = Utils.initials(emp.Name);
    const icon  = Utils.desigIcon(emp.Designation);
    const pctCl = Utils.pctColor(stats.completionPct);
    return `
      <div class="col-12 col-sm-6 col-lg-4">
        <a href="tasks.html?employee=${encodeURIComponent(emp.Employee_ID)}" class="emp-card text-decoration-none">
          <div class="emp-card-header">
            ${emp.Photo_URL ? `<img src="${Utils.esc(emp.Photo_URL)}" class="emp-avatar" alt="${Utils.esc(emp.Name)}">` : `<div class="emp-avatar-initials">${Utils.esc(ini)}</div>`}
            <div>
              <div class="emp-name">${Utils.esc(emp.Name)} ${Utils.leaveBadge(emp)}</div>
              <div class="emp-desig"><i class="bi ${icon} me-1"></i>${Utils.esc(emp.Designation)}</div>
            </div>
          </div>
          <div class="row g-2 mt-2">
            <div class="col-3 text-center"><div class="emp-stat-val">${stats.total}</div><div class="emp-stat-lbl">Total</div></div>
            <div class="col-3 text-center"><div class="emp-stat-val text-success">${stats.completed}</div><div class="emp-stat-lbl">Done</div></div>
            <div class="col-3 text-center"><div class="emp-stat-val text-warning">${stats.pending}</div><div class="emp-stat-lbl">Pending</div></div>
            <div class="col-3 text-center"><div class="emp-stat-val text-danger">${stats.overdue}</div><div class="emp-stat-lbl">Overdue</div></div>
          </div>
          <div class="mt-3">
            <div class="d-flex justify-content-between mb-1">
              <small class="text-muted">Completion Rate</small>
              <small class="fw-600 text-${pctCl}">${stats.completionPct}%</small>
            </div>
            <div class="progress" style="height:5px">
              <div class="progress-bar bg-${pctCl}" style="width:${stats.completionPct}%"></div>
            </div>
          </div>
          ${stats.overdue > 0 ? `<div class="mt-2"><span class="badge bg-danger bg-opacity-10 text-danger"><i class="bi bi-exclamation-circle me-1"></i>${stats.overdue} overdue task${stats.overdue>1?'s':''}</span></div>` : ''}
          <div class="emp-card-footer"><i class="bi bi-envelope me-1"></i>${Utils.esc(emp.Email||'—')}</div>
        </a>
      </div>`;
  }).join('');

  // Recent tasks (last 10)
  const empMap = Object.fromEntries(employees.map(e => [e.Employee_ID, e]));
  const recent = tasks.slice().reverse().slice(0, 10);
  const recentRows = recent.length ? recent.map((t, i) => {
    const emp = empMap[t.Employee_ID];
    const od  = Utils.isOverdue(t.Deadline, t.Status);
    return `<tr class="${od?'table-danger':''}">
      <td><div class="fw-500">${Utils.esc(t.Task_Title)}</div>${od?`<small class="text-danger"><i class="bi bi-exclamation-circle me-1"></i>Overdue ${Utils.daysPending(t.Deadline)}d</small>`:''}</td>
      <td>${Utils.esc(emp?.Name || t.Employee_ID)}</td>
      <td>${Utils.priorityBadge(t.Priority)}</td>
      <td>${Utils.formatDate(t.Deadline)}</td>
      <td>${Utils.statusBadge(t.Status)}</td>
      <td><a href="create_task.html?edit=${encodeURIComponent(t.Task_ID)}" class="btn btn-xs btn-outline-secondary"><i class="bi bi-pencil"></i></a></td>
    </tr>`;
  }).join('') : `<tr><td colspan="6" class="text-center text-muted py-3">No tasks found</td></tr>`;

  document.getElementById('pageContent').innerHTML = `
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
      <div>
        <h4 class="fw-700 mb-0"><i class="bi bi-grid-fill me-2 text-primary"></i>Admin Dashboard</h4>
        <small class="text-muted">Welcome back, ${Utils.esc(session.name)} &bull; ${Utils.esc(today)}</small>
      </div>
      <div class="d-flex gap-2">
        <a href="create_task.html" class="btn btn-primary"><i class="bi bi-plus-circle me-1"></i>New Task</a>
        <a href="reports.html" class="btn btn-outline-secondary"><i class="bi bi-file-earmark-bar-graph me-1"></i>Reports</a>
      </div>
    </div>

    <div class="row g-3 mb-4">
      <div class="col-6 col-sm-4 col-lg-2"><div class="stat-card border-start border-primary border-4"><div class="stat-icon text-primary"><i class="bi bi-list-task"></i></div><div class="stat-val">${totalTasks}</div><div class="stat-lbl">Total Tasks</div></div></div>
      <div class="col-6 col-sm-4 col-lg-2"><div class="stat-card border-start border-success border-4"><div class="stat-icon text-success"><i class="bi bi-check2-all"></i></div><div class="stat-val">${approvedTasks}</div><div class="stat-lbl">Approved</div></div></div>
      <div class="col-6 col-sm-4 col-lg-2"><div class="stat-card border-start border-info border-4"><div class="stat-icon text-info"><i class="bi bi-hourglass-split"></i></div><div class="stat-val">${completedTasks}</div><div class="stat-lbl">Completed</div></div></div>
      <div class="col-6 col-sm-4 col-lg-2"><div class="stat-card border-start border-warning border-4"><div class="stat-icon text-warning"><i class="bi bi-clock"></i></div><div class="stat-val">${pendingTasks}</div><div class="stat-lbl">Pending</div></div></div>
      <div class="col-6 col-sm-4 col-lg-2"><div class="stat-card border-start border-danger border-4"><div class="stat-icon text-danger"><i class="bi bi-exclamation-triangle"></i></div><div class="stat-val">${overdueTasks}</div><div class="stat-lbl">Overdue</div></div></div>
      <div class="col-6 col-sm-4 col-lg-2">
        ${pendingApprovals > 0 ? `<a href="approvals.html" class="text-decoration-none">` : ''}
        <div class="stat-card border-start border-4" style="border-left-color:var(--c-purple)!important">
          <div class="stat-icon" style="color:var(--c-purple)"><i class="bi bi-bell"></i></div>
          <div class="stat-val">${pendingApprovals}</div>
          <div class="stat-lbl">Pending Approvals ${pendingApprovals>0?'<span class="badge bg-danger ms-1">!</span>':''}</div>
        </div>
        ${pendingApprovals > 0 ? `</a>` : ''}
      </div>
    </div>

    <h5 class="fw-700 mb-3"><i class="bi bi-people-fill me-2 text-primary"></i>Employee Overview</h5>
    <div class="row g-3 mb-4">${empCards}</div>

    <div class="row g-3 mb-4">
      <div class="col-lg-4">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-header fw-600">Task Distribution</div>
          <div class="card-body d-flex align-items-center justify-content-center" style="height:250px">
            <canvas id="taskDistChart"></canvas>
          </div>
        </div>
      </div>
      <div class="col-lg-8">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-header fw-600">Employee Performance</div>
          <div class="card-body" style="height:250px">
            <canvas id="empPerfChart"></canvas>
          </div>
        </div>
      </div>
    </div>

    <div class="card border-0 shadow-sm mb-4">
      <div class="card-header d-flex justify-content-between align-items-center">
        <span class="fw-600"><i class="bi bi-clock-history me-2"></i>Recent Tasks</span>
        <a href="tasks.html" class="btn btn-sm btn-outline-primary">View All</a>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover mb-0">
            <thead class="table-light"><tr><th>Task</th><th>Employee</th><th>Priority</th><th>Deadline</th><th>Status</th><th>Action</th></tr></thead>
            <tbody>${recentRows}</tbody>
          </table>
        </div>
      </div>
    </div>
  `;

  // Charts — degrade gracefully if the Chart.js CDN failed to load
  if (typeof Chart === 'undefined') {
    document.querySelectorAll('canvas').forEach(c => {
      if (c.parentElement) c.parentElement.innerHTML =
        '<div class="text-muted small text-center w-100"><i class="bi bi-wifi-off me-1"></i>Chart library could not load. Check the internet connection and refresh.</div>';
    });
    return;
  }
  const statusCounts = s => tasks.filter(t => t.Status === s).length;
  new Chart(document.getElementById('taskDistChart'), {
    type: 'doughnut',
    data: {
      labels: ['Approved','Completed','In Progress','Pending','Rejected'],
      datasets: [{data:[statusCounts('Approved'),statusCounts('Completed'),statusCounts('In Progress'),statusCounts('Pending'),statusCounts('Rejected')],
        backgroundColor:['#4ade80','#38bdf8','#60a5fa','#facc15','#f87171'],borderColor:'rgba(255,255,255,0.08)',borderWidth:2}]
    },
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}}}
  });

  const empData = employees.map(e => Utils.employeeStats(tasks, e.Employee_ID));
  new Chart(document.getElementById('empPerfChart'), {
    type:'bar',
    data:{
      labels: employees.map(e=>e.Name),
      datasets:[
        {label:'Total',     data:empData.map(d=>d.total),     backgroundColor:'rgba(96,165,250,.55)'},
        {label:'Completed', data:empData.map(d=>d.completed), backgroundColor:'rgba(74,222,128,.55)'},
        {label:'Pending',   data:empData.map(d=>d.pending),   backgroundColor:'rgba(250,204,21,.55)'},
      ]
    },
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top'}},scales:{y:{beginAtZero:true,ticks:{stepSize:1}}}}
  });
});
</script>
</body>
</html>
