<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Management — ME-RIISE FOUNDATION</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link href="../assets/css/style.css" rel="stylesheet">
</head>
<body>
<div class="tbi-wrapper">
  <div id="sidebarContainer"></div>
  <div class="tbi-main-wrap">
    <div id="topbarContainer"></div>
    <main class="tbi-content" id="pageContent"></main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.7.1/dist/jspdf.plugin.autotable.min.js"></script>
<script src="../assets/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  await TBI.ready();
  if (!renderShell('Task Management', true)) return;
  TBI.autoReloadOnSync();   // refresh when another dashboard changes the data

  backfillCompletedDates();

  // Newest first: most recently assigned at the top; ties keep newest-added first.
  const tasks     = DB.getAll('tasks').slice().reverse();
  tasks.sort((a, b) => {
    const da = (a.Assigned_Date || '') + ' ' + (a.Deadline_Time || '');
    const db = (b.Assigned_Date || '') + ' ' + (b.Deadline_Time || '');
    return db.localeCompare(da);
  });
  const allEmployees = DB.getAll('employees');
  const employees = staffOnly(allEmployees);
  const empMap    = Object.fromEntries(allEmployees.map(e => [e.Employee_ID, e]));
  const params    = getParams();

  // Parse filter params
  const fEmployees  = params.getAll('employee').filter(Boolean);
  const fStatuses   = params.getAll('status').filter(Boolean);
  const fPriorities = params.getAll('priority').filter(Boolean);
  const fDate       = params.get('date') || '';
  const fSearch     = (params.get('q') || '').trim();
  const fEmployee   = fEmployees.length === 1 ? fEmployees[0] : '';

  // Filter tasks
  const filtered = tasks.filter(t => {
    if (fEmployees.length  && !fEmployees.includes(t.Employee_ID)) return false;
    if (fStatuses.length   && !fStatuses.includes(t.Status))       return false;
    if (fPriorities.length && !fPriorities.includes(t.Priority))   return false;
    if (fDate && (t.Assigned_Date||'').slice(0,10) !== fDate)       return false;
    if (fSearch) {
      const hay = ((t.Task_Title||'') + ' ' + (t.Description||'')).toLowerCase();
      if (!hay.includes(fSearch.toLowerCase())) return false;
    }
    return true;
  });

  // Sort employees
  const order = ['CEO','COO','TBI Manager','Programme Associate/Outreach officer','Software Associate','Finance Associate','Innovation Associate','Support Staff'];
  employees.sort((a,b) => { const ai=order.indexOf(a.Designation); const bi=order.indexOf(b.Designation); return (ai<0?99:ai)-(bi<0?99:bi); });

  const empCheckboxes = employees.map(emp => `
    <div class="form-check mb-1">
      <input class="form-check-input emp-filter-chk" type="checkbox" name="employee" value="${Utils.esc(emp.Employee_ID)}" id="empChk_${Utils.esc(emp.Employee_ID)}" ${fEmployees.includes(emp.Employee_ID)?'checked':''}>
      <label class="form-check-label small" style="white-space:nowrap" for="empChk_${Utils.esc(emp.Employee_ID)}">${Utils.esc(emp.Name)} <span class="text-muted" style="font-size:.7rem">— ${Utils.esc(emp.Designation)}</span></label>
    </div>`).join('');

  const statusCheckboxes = TASK_STATUSES.map(s => `
    <div class="form-check mb-1">
      <input class="form-check-input stat-filter-chk" type="checkbox" name="status" value="${s}" id="statChk_${s}" ${fStatuses.includes(s)?'checked':''}>
      <label class="form-check-label small" for="statChk_${s}">${s}</label>
    </div>`).join('');

  const priCheckboxes = PRIORITIES.map(p => `
    <div class="form-check mb-1">
      <input class="form-check-input pri-filter-chk" type="checkbox" name="priority" value="${p}" id="priChk_${p}" ${fPriorities.includes(p)?'checked':''}>
      <label class="form-check-label small" for="priChk_${p}">${p}</label>
    </div>`).join('');

  const empLabel  = !fEmployees.length ? 'All Employees' : fEmployees.length===1 ? (empMap[fEmployees[0]]?.Name||'Unknown') : `${fEmployees.length} employees`;
  const statLabel = !fStatuses.length  ? 'All Status'    : fStatuses.length===1  ? fStatuses[0]  : `${fStatuses.length} statuses`;
  const priLabel  = !fPriorities.length? 'All Priorities': fPriorities.length===1? fPriorities[0]: `${fPriorities.length} priorities`;

  const empInfoBanner = fEmployee && empMap[fEmployee] ? `
    <div class="alert alert-primary mb-4">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
        <div>
          <div class="fw-700">${Utils.esc(empMap[fEmployee].Name)}</div>
          <div class="small">${Utils.esc(empMap[fEmployee].Designation)}${empMap[fEmployee].Email?` &nbsp;·&nbsp; ${Utils.esc(empMap[fEmployee].Email)}`:''}</div>
        </div>
        <a href="tasks.html" class="btn btn-sm btn-outline-primary">View all</a>
      </div>
    </div>` : '';

  // Group filtered tasks by employee (employees already sorted by designation)
  const groups = {};
  filtered.forEach(t => { (groups[t.Employee_ID] = groups[t.Employee_ID] || []).push(t); });
  const groupOrderIds = employees.map(e => e.Employee_ID).filter(id => groups[id]);

  // Expose data for the grouped export
  window._taskExport = { filtered, empMap, employees };

  const renderTaskRow = (t, n) => {
    const od   = Utils.isOverdue(t.Deadline, t.Status);
    const isDone = ['Completed','Approved'].includes(t.Status);
    // Days overdue freezes at the completion date once a task is done,
    // otherwise it keeps counting up to today.
    const days = isDone
      ? (t.Completed_Date ? Utils.daysBetween(t.Deadline, t.Completed_Date) : 0)
      : Utils.daysPending(t.Deadline);
    const completedCell = isDone && t.Completed_Date
      ? `<span class="badge bg-success">${Utils.esc(Utils.formatDateTime(t.Completed_Date))}</span>`
      : '<span class="text-muted">—</span>';
    const statusOptions = TASK_STATUSES.map(s => `<li><button class="dropdown-item${t.Status===s?' active':''}" onclick="updateStatus('${t.Task_ID}','${s}')">${s}</button></li>`).join('');
    return `<tr class="${od?'table-danger':''}">
      <td><input type="checkbox" class="form-check-input task-select-chk" value="${Utils.esc(t.Task_ID)}" onchange="updateSelCount()"></td>
      <td class="small">${n}</td>
      <td>
        <div class="fw-500">${Utils.esc(t.Task_Title)}</div>
        ${t.Description?`<small class="text-muted">${Utils.esc(t.Description.slice(0,60))}…</small>`:''}
      </td>
      <td>${Utils.priorityBadge(t.Priority)}</td>
      <td class="small">${Utils.formatDate(t.Assigned_Date)}</td>
      <td class="small ${od?'text-danger fw-600':''}">${Utils.formatDate(t.Deadline)}</td>
      <td>${days>0?`<span class="badge bg-danger">${days}d</span>`:['Pending','In Progress'].includes(t.Status)?'<span class="badge bg-secondary">0</span>':'<span class="text-muted">—</span>'}</td>
      <td>${Utils.statusBadge(t.Status)}</td>
      <td class="text-center">${completedCell}</td>
      <td>
        <div class="d-flex gap-1 flex-wrap">
          <a href="create_task.html?edit=${encodeURIComponent(t.Task_ID)}" class="btn btn-xs btn-outline-primary" title="Edit"><i class="bi bi-pencil"></i></a>
          <div class="btn-group">
            <button type="button" class="btn btn-xs btn-outline-secondary dropdown-toggle" data-bs-toggle="dropdown">Status</button>
            <ul class="dropdown-menu">${statusOptions}</ul>
          </div>
          <button type="button" class="btn btn-xs btn-outline-danger" title="Delete" onclick="confirmDelete('${t.Task_ID}')"><i class="bi bi-trash"></i></button>
        </div>
      </td>
    </tr>`;
  };

  const tableRows = filtered.length ? groupOrderIds.map(id => {
    const emp = empMap[id];
    const list = groups[id];
    const ids = list.map(t => t.Task_ID);
    const header = `<tr class="task-group-header">
      <td><input type="checkbox" class="form-check-input grp-select-chk" data-ids='${JSON.stringify(ids)}' onchange="toggleGroup(this)"></td>
      <td colspan="9" class="fw-700">
        <i class="bi bi-person-fill me-1"></i>${Utils.esc(emp?.Name || id)}
        <span class="fw-normal text-muted small"> — ${Utils.esc(emp?.Designation || '')} · ${list.length} task${list.length>1?'s':''}</span>
      </td>
    </tr>`;
    return header + list.map((t, i) => renderTaskRow(t, i + 1)).join('');
  }).join('') : `<tr><td colspan="10" class="text-center py-4 text-muted">No tasks found</td></tr>`;

  document.getElementById('pageContent').innerHTML = `
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
      <h4 class="fw-700 mb-0"><i class="bi bi-list-task me-2 text-primary"></i>Task Management</h4>
      <a href="create_task.html" class="btn btn-primary"><i class="bi bi-plus-circle me-1"></i>Create Task</a>
    </div>

    <div class="card border-0 shadow-sm mb-4">
      <div class="card-body">
        <form id="filterForm" class="row g-2 align-items-end">
          <div class="col-12 col-sm-6 col-lg-3">
            <input type="text" class="form-control" id="searchInput" placeholder="Search tasks…" value="${Utils.esc(fSearch)}">
          </div>
          <div class="col-6 col-sm-4 col-lg-2">
            <div class="dropdown w-100">
              <button class="btn btn-outline-secondary dropdown-toggle w-100 text-start fw-normal" type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside" data-bs-display="static" id="empDropdownBtn">
                <span id="empFilterLabel">${Utils.esc(empLabel)}</span>
              </button>
              <div class="dropdown-menu p-2 w-100" style="max-height:260px;overflow-y:auto">${empCheckboxes}</div>
            </div>
          </div>
          <div class="col-6 col-sm-4 col-lg-2">
            <div class="dropdown w-100">
              <button class="btn btn-outline-secondary dropdown-toggle w-100 text-start fw-normal" type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside" data-bs-display="static" id="statDropdownBtn">
                <span id="statFilterLabel">${Utils.esc(statLabel)}</span>
              </button>
              <div class="dropdown-menu p-2 w-100" style="min-width:160px">${statusCheckboxes}</div>
            </div>
          </div>
          <div class="col-6 col-sm-4 col-lg-2">
            <div class="dropdown w-100">
              <button class="btn btn-outline-secondary dropdown-toggle w-100 text-start fw-normal" type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside" data-bs-display="static" id="priDropdownBtn">
                <span id="priFilterLabel">${Utils.esc(priLabel)}</span>
              </button>
              <div class="dropdown-menu p-2 w-100" style="min-width:160px">${priCheckboxes}</div>
            </div>
          </div>
          <div class="col-6 col-sm-4 col-lg-2">
            <input type="date" class="form-control" id="dateInput" value="${Utils.esc(fDate)}">
          </div>
          <div class="col-12 col-sm-auto d-flex gap-2">
            <button type="button" class="btn btn-primary" onclick="applyFilters()">Filter</button>
            <a href="tasks.html" class="btn btn-outline-secondary">Clear</a>
          </div>
        </form>
      </div>
    </div>

    ${empInfoBanner}

    <div class="d-flex justify-content-between align-items-center mb-2 flex-wrap gap-2">
      <small class="text-muted">Showing ${filtered.length} of ${tasks.length} tasks · <span id="selCount">0</span> selected</small>
      <div class="d-flex gap-2 align-items-center">
        <span class="small text-muted d-none d-md-inline"><i class="bi bi-info-circle me-1"></i>Tick rows to export only those</span>
        <button class="btn btn-sm btn-outline-success" onclick="exportTasksGrouped('excel')"><i class="bi bi-file-earmark-excel me-1"></i>Excel</button>
        <button class="btn btn-sm btn-outline-danger" onclick="exportTasksGrouped('pdf')"><i class="bi bi-file-earmark-pdf me-1"></i>PDF</button>
      </div>
    </div>

    <div class="card border-0 shadow-sm">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover mb-0" id="taskTable">
            <thead class="table-light"><tr><th style="width:34px"><input type="checkbox" class="form-check-input" id="selectAllTasks" onchange="toggleSelectAll(this)"></th><th>#</th><th>Task Title</th><th>Priority</th><th>Assigned</th><th>Deadline</th><th>Days Overdue</th><th>Status</th><th>Completed Date &amp; Time</th><th>Actions</th></tr></thead>
            <tbody>${tableRows}</tbody>
          </table>
        </div>
      </div>
    </div>
  `;

  // Dynamic label updates
  document.querySelectorAll('.emp-filter-chk').forEach(c => c.addEventListener('change', () => {
    const checked = [...document.querySelectorAll('.emp-filter-chk:checked')];
    document.getElementById('empFilterLabel').textContent =
      checked.length===0 ? 'All Employees' : checked.length===1 ? checked[0].nextElementSibling.textContent.split('—')[0].trim() : `${checked.length} employees selected`;
  }));
  document.querySelectorAll('.stat-filter-chk').forEach(c => c.addEventListener('change', () => {
    const checked = [...document.querySelectorAll('.stat-filter-chk:checked')];
    document.getElementById('statFilterLabel').textContent =
      checked.length===0 ? 'All Status' : checked.length===1 ? checked[0].nextElementSibling.textContent.trim() : `${checked.length} statuses selected`;
  }));
  document.querySelectorAll('.pri-filter-chk').forEach(c => c.addEventListener('change', () => {
    const checked = [...document.querySelectorAll('.pri-filter-chk:checked')];
    document.getElementById('priFilterLabel').textContent =
      checked.length===0 ? 'All Priorities' : checked.length===1 ? checked[0].nextElementSibling.textContent.trim() : `${checked.length} priorities selected`;
  }));
});

function applyFilters() {
  const q         = document.getElementById('searchInput')?.value.trim() || '';
  const date      = document.getElementById('dateInput')?.value || '';
  const employees = [...document.querySelectorAll('.emp-filter-chk:checked')].map(c => c.value);
  const statuses  = [...document.querySelectorAll('.stat-filter-chk:checked')].map(c => c.value);
  const priorities= [...document.querySelectorAll('.pri-filter-chk:checked')].map(c => c.value);
  const p = new URLSearchParams();
  if (q) p.set('q', q);
  if (date) p.set('date', date);
  employees.forEach(e => p.append('employee', e));
  statuses.forEach(s => p.append('status', s));
  priorities.forEach(pr => p.append('priority', pr));
  window.location.href = 'tasks.html?' + p.toString();
}

async function updateStatus(taskId, newStatus) {
  const task = DB.findOne('tasks', 'Task_ID', taskId);
  if (!task) return;
  const session = Auth.getSession();
  const now     = Utils.nowStamp();
  const patch   = {Status: newStatus};
  if (['Completed','Approved'].includes(newStatus)) {
    patch.Completed_Date = task.Completed_Date || now;
  } else if (newStatus !== 'Rejected') {
    patch.Completed_Date = '';
  }
  DB.updateById('tasks', 'Task_ID', taskId, patch);
  // The admin's decision is final: resolve any approval already waiting on this
  // task instead of queueing a new one for the admin to approve a second time.
  if (['Completed','Approved','Rejected'].includes(newStatus)) {
    const decision = newStatus === 'Rejected' ? 'Rejected' : 'Approved';
    DB.getAll('approvals')
      .filter(a => a.Task_ID === taskId && a.Status === 'Pending')
      .forEach(a => DB.updateById('approvals', 'Approval_ID', a.Approval_ID,
        {Status: decision, Approved_By: session.name, Approval_Date: now}));
  }
  setFlash('success', `Task status updated to ${newStatus}.`);
  await API.flush();
  location.reload();
}

// ── Selection helpers ─────────────────────────────────────────
function updateSelCount() {
  const n = document.querySelectorAll('.task-select-chk:checked').length;
  const el = document.getElementById('selCount');
  if (el) el.textContent = n;
}
function toggleSelectAll(box) {
  document.querySelectorAll('.task-select-chk').forEach(c => c.checked = box.checked);
  document.querySelectorAll('.grp-select-chk').forEach(c => c.checked = box.checked);
  updateSelCount();
}
function toggleGroup(box) {
  const ids = JSON.parse(box.dataset.ids || '[]');
  ids.forEach(id => {
    const c = document.querySelector(`.task-select-chk[value="${CSS.escape(id)}"]`);
    if (c) c.checked = box.checked;
  });
  updateSelCount();
}

// ── Grouped export (Excel / PDF), respects row selection ──────
function exportTasksGrouped(format) {
  const data = window._taskExport;
  if (!data) return;

  const selectedIds = [...document.querySelectorAll('.task-select-chk:checked')].map(c => c.value);
  let list = data.filtered;
  if (selectedIds.length) list = list.filter(t => selectedIds.includes(t.Task_ID));
  if (!list.length) { showFlash('warning', 'No tasks to export. Tick some rows or clear the selection.'); return; }

  // Group by employee in designation order
  const groups = {};
  list.forEach(t => { (groups[t.Employee_ID] = groups[t.Employee_ID] || []).push(t); });
  const orderIds = data.employees.map(e => e.Employee_ID).filter(id => groups[id]);
  const cols = ['#', 'Task Title & Description', 'Priority', 'Assigned', 'Deadline', 'Days Overdue', 'Status', 'Completed Date & Time'];

  const fmtDeadline  = t => Utils.formatDate(t.Deadline) + (t.Deadline_Time ? ' ' + t.Deadline_Time : '');
  const titleAndDesc = t => t.Description ? `${t.Task_Title}\n${t.Description}` : t.Task_Title;
  const rowFor = (t, i) => {
    const isDone = ['Completed','Approved'].includes(t.Status);
    const overdue = isDone
      ? (t.Completed_Date ? Utils.daysBetween(t.Deadline, t.Completed_Date) : 0)
      : Utils.daysPending(t.Deadline);
    return [i + 1, titleAndDesc(t), t.Priority, Utils.formatDate(t.Assigned_Date),
            fmtDeadline(t), overdue > 0 ? overdue + 'd' : '—', t.Status,
            isDone && t.Completed_Date ? Utils.formatDateTime(t.Completed_Date) : '—'];
  };

  if (format === 'excel') {
    if (typeof XLSX === 'undefined') { alert('Excel library not loaded'); return; }
    const ncols = cols.length;
    const aoa = excelHeaderRows('Task Report');
    const groupRows = [], colHdrRows = [], dataRows = [];
    orderIds.forEach(id => {
      const emp = data.empMap[id];
      groupRows.push(aoa.length);
      aoa.push([`${emp?.Name || id}  —  ${emp?.Designation || ''}  (${groups[id].length})`]);
      colHdrRows.push(aoa.length);
      aoa.push(cols);
      groups[id].forEach((t, i) => { dataRows.push(aoa.length); aoa.push(rowFor(t, i)); });
      aoa.push([]);
    });
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = [{wch:5},{wch:72},{wch:10},{wch:14},{wch:18},{wch:13},{wch:12},{wch:14}];

    // Branded heading
    xlStyleBrandHeader(ws, ncols);
    // Coloured employee band (merged across the row)
    ws['!merges'] = ws['!merges'] || [];
    groupRows.forEach(r => {
      ws['!merges'].push({ s:{r,c:0}, e:{r,c:ncols-1} });
      xlStyleRow(ws, r, ncols, XL.groupHdr);
      (ws['!rows'] = ws['!rows'] || [])[r] = { hpt: 20 };
    });
    // Dark column-header band
    colHdrRows.forEach(r => xlStyleRow(ws, r, ncols, xlBordered(XL.colHdr)));
    // Zebra-striped task rows
    let stripe = 0;
    dataRows.forEach(r => xlStyleRow(ws, r, ncols, xlBordered((stripe++ % 2 === 0) ? XL.cellAlt : XL.cell)));

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Tasks');
    XLSX.writeFile(wb, 'ME-RIISE_FOUNDATION_Tasks_' + Utils.today() + '.xlsx');
  } else {
    if (typeof jspdf === 'undefined') { alert('PDF library not loaded'); return; }
    const { jsPDF } = jspdf;
    const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
    let y = pdfHeader(doc, 'Task Report');
    orderIds.forEach(id => {
      const emp = data.empMap[id];
      if (y > doc.internal.pageSize.getHeight() - 28) { doc.addPage(); y = 15; }
      doc.setFontSize(10); doc.setTextColor(0, 90, 140);
      doc.text(`${emp?.Name || id}  —  ${emp?.Designation || ''}  (${groups[id].length})`, 15, y);
      doc.autoTable({
        head: [cols], body: groups[id].map((t, i) => rowFor(t, i)), startY: y + 2,
        styles: { fontSize: 8, cellPadding: 2 },
        headStyles: { fillColor: [10, 50, 100], textColor: 255, fontStyle: 'bold' },
        alternateRowStyles: { fillColor: [235, 244, 255] },
        columnStyles: { 1: { cellWidth: 130 } }
      });
      y = doc.lastAutoTable.finalY + 9;
    });
    doc.save('ME-RIISE_FOUNDATION_Tasks_' + Utils.today() + '.pdf');
  }
}
</script>
</body>
</html>
