<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Management — ME-RIISE FOUNDATION</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link href="../assets/css/style.css" rel="stylesheet">
</head>
<body>
<div class="tbi-wrapper">
  <div id="sidebarContainer"></div>
  <div class="tbi-main-wrap">
    <div id="topbarContainer"></div>
    <main class="tbi-content" id="pageContent"></main>
  </div>
</div>

<!-- Add Employee Modal -->
<div class="modal fade" id="addEmpModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content border-0">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title fw-700"><i class="bi bi-person-plus me-2"></i>Add New Employee</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="addEmpAlert"></div>
        <div class="row g-3">
          <div class="col-md-6"><label class="form-label fw-500">Full Name <span class="text-danger">*</span></label><input type="text" class="form-control" id="newName" required></div>
          <div class="col-md-6">
            <label class="form-label fw-500">Designation <span class="text-danger">*</span></label>
            <select class="form-select" id="newDesig" required>
              <option value="">Select…</option>
            </select>
          </div>
          <div class="col-md-6"><label class="form-label fw-500">Email <span class="text-danger">*</span></label><input type="email" class="form-control" id="newEmail" required></div>
          <div class="col-md-6"><label class="form-label fw-500">Phone</label><input type="tel" class="form-control" id="newPhone" placeholder="+91 XXXXX XXXXX"></div>
          <div class="col-md-6"><label class="form-label fw-500">Date of Joining</label><input type="date" class="form-control" id="newJoinDate"></div>
          <div class="col-12">
            <label class="form-label fw-500">Profile Picture</label>
            <div class="d-flex align-items-center gap-3">
              <img id="newPhotoPreview" src="" alt="" class="rounded-circle" width="56" height="56" style="object-fit:cover;border:2px solid var(--glass-bd2);display:none">
              <div class="flex-fill">
                <input type="file" accept="image/*" class="form-control form-control-sm mb-2" id="newPhotoFile" onchange="pickPhoto('newPhotoFile','newPhotoPreview','newPhotoData','newPhoto')">
                <input type="url" class="form-control form-control-sm" id="newPhoto" placeholder="…or paste an image URL" oninput="document.getElementById('newPhotoData').value=''">
              </div>
            </div>
            <input type="hidden" id="newPhotoData">
          </div>
          <div class="col-md-6"><label class="form-label fw-500">Username <span class="text-danger">*</span></label><input type="text" class="form-control" id="newUsername" required autocomplete="off"></div>
          <div class="col-md-6"><label class="form-label fw-500">Password <span class="text-danger">*</span></label><input type="password" class="form-control" id="newPassword" required minlength="8" placeholder="Min 8 characters" autocomplete="new-password"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" onclick="addEmployee()">Add Employee</button>
      </div>
    </div>
  </div>
</div>

<!-- Employee Profile Modal -->
<div class="modal fade" id="empProfileModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content border-0">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title fw-700"><i class="bi bi-person-vcard me-2"></i>Employee Profile</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="empProfileBody"></div>
    </div>
  </div>
</div>

<!-- Reset Password Modal -->
<div class="modal fade" id="resetPwdModal" tabindex="-1">
  <div class="modal-dialog modal-sm">
    <div class="modal-content border-0">
      <div class="modal-header">
        <h6 class="modal-title fw-700">Reset Password</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p class="small text-muted mb-2">Reset password for <strong id="resetEmpName"></strong></p>
        <div id="resetPwdAlert"></div>
        <input type="password" class="form-control" id="resetNewPwd" minlength="8" required placeholder="New password (min 8 chars)">
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-sm btn-warning" onclick="doResetPwd()">Reset</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/app.js"></script>
<script>
let _resetUserId = '';

document.addEventListener('DOMContentLoaded', async () => {
  await TBI.ready();
  if (!renderShell('Employee Management', true)) return;
  TBI.autoReloadOnSync();   // refresh when another dashboard changes the data

  const tasks     = DB.getAll('tasks');
  const employees = staffOnly(DB.getAll('employees'));   // the CEO is the head/admin, not listed as staff
  const users     = DB.getAll('users');
  const userByEmp = Object.fromEntries(users.map(u => [u.Employee_ID, u]));

  const order = ['CEO','COO','TBI Manager','Programme Associate/Outreach officer','Software Associate','Finance Associate','Innovation Associate','Support Staff'];
  employees.sort((a,b) => { const ai=order.indexOf(a.Designation); const bi=order.indexOf(b.Designation); return (ai<0?99:ai)-(bi<0?99:bi); });

  // Populate designation select
  const desigSel = document.getElementById('newDesig');
  DESIGNATIONS.filter(d => d !== 'CEO').forEach(d => { const o=document.createElement('option'); o.value=o.textContent=d; desigSel.appendChild(o); });

  const empCards = employees.map(emp => {
    const stats   = Utils.employeeStats(tasks, emp.Employee_ID);
    const ini     = Utils.initials(emp.Name);
    const user    = userByEmp[emp.Employee_ID];
    const pctCl   = Utils.pctColor(stats.completionPct);
    const empUrl  = `tasks.html?employee=${encodeURIComponent(emp.Employee_ID)}`;
    return `
      <div class="col-12 col-md-6 col-xl-4">
        <div class="emp-card" onclick="window.location='${empUrl}'" role="link" tabindex="0" onkeydown="if(event.key==='Enter')window.location='${empUrl}'">
          <div class="emp-card-header">
            ${emp.Photo_URL ? `<img src="${Utils.esc(emp.Photo_URL)}" class="emp-avatar" alt="${Utils.esc(emp.Name)}">` : `<div class="emp-avatar-initials">${Utils.esc(ini)}</div>`}
            <div>
              <div class="emp-name">${Utils.esc(emp.Name)} ${Utils.leaveBadge(emp)}</div>
              <div class="emp-desig">${Utils.esc(emp.Designation)}</div>
              <div style="font-size:.68rem" class="text-muted mt-1">${Utils.esc(emp.Email)}</div>
              ${emp.Joining_Date ? `<div style="font-size:.68rem" class="text-muted"><i class="bi bi-calendar-check me-1"></i>Joined ${Utils.esc(Utils.formatDate(emp.Joining_Date))}</div>` : ''}
            </div>
          </div>
          <div class="row g-2 text-center mb-3">
            <div class="col-3"><div class="emp-stat-val text-primary">${stats.total}</div><div class="emp-stat-lbl">Total</div></div>
            <div class="col-3"><div class="emp-stat-val text-success">${stats.completed}</div><div class="emp-stat-lbl">Done</div></div>
            <div class="col-3"><div class="emp-stat-val text-warning">${stats.pending}</div><div class="emp-stat-lbl">Pending</div></div>
            <div class="col-3"><div class="emp-stat-val text-danger">${stats.overdue}</div><div class="emp-stat-lbl">Overdue</div></div>
          </div>
          <div class="mb-3">
            <div class="d-flex justify-content-between mb-1">
              <small class="text-muted">Completion Rate</small>
              <small class="fw-600">${stats.completionPct}%</small>
            </div>
            <div class="progress" style="height:5px"><div class="progress-bar bg-${pctCl}" style="width:${stats.completionPct}%"></div></div>
          </div>
          <div class="d-flex gap-2" onclick="event.stopPropagation()">
            <a href="${empUrl}" class="btn btn-sm btn-outline-primary flex-fill"><i class="bi bi-list-task me-1"></i>Tasks</a>
            <button class="btn btn-sm btn-outline-info flex-fill" onclick="event.stopPropagation();openProfile('${Utils.esc(emp.Employee_ID)}')"><i class="bi bi-person-vcard me-1"></i>Profile</button>
            ${user ? `<button class="btn btn-sm btn-outline-warning" onclick="event.stopPropagation();openResetPwd('${Utils.esc(user.User_ID)}','${Utils.esc(emp.Name)}')" title="Reset Password"><i class="bi bi-key"></i></button>` : ''}
          </div>
          ${user ? `<div class="emp-card-footer"><i class="bi bi-person-circle me-1"></i>Login: <code>${Utils.esc(user.Username)}</code></div>` : ''}
        </div>
      </div>`;
  }).join('');

  document.getElementById('pageContent').innerHTML = `
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h4 class="fw-700 mb-0"><i class="bi bi-people-fill me-2 text-primary"></i>Employee Management</h4>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addEmpModal"><i class="bi bi-person-plus me-1"></i>Add Employee</button>
    </div>
    <div class="row g-3">${empCards}</div>
  `;
});

async function addEmployee() {
  const name     = document.getElementById('newName').value.trim();
  const desig    = document.getElementById('newDesig').value;
  const email    = document.getElementById('newEmail').value.trim();
  const phone    = document.getElementById('newPhone').value.trim();
  const joinDate = document.getElementById('newJoinDate').value;
  const photo    = document.getElementById('newPhotoData').value || document.getElementById('newPhoto').value.trim();
  const username = document.getElementById('newUsername').value.trim();
  const password = document.getElementById('newPassword').value;
  const alertEl  = document.getElementById('addEmpAlert');

  if (!name || !desig || !email || !username || !password) {
    alertEl.innerHTML = `<div class="alert alert-danger py-2 small mb-2">All required fields must be filled.</div>`; return;
  }
  const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if (!emailRe.test(email)) { alertEl.innerHTML = `<div class="alert alert-danger py-2 small mb-2">Invalid email address.</div>`; return; }
  if (password.length < 8) { alertEl.innerHTML = `<div class="alert alert-danger py-2 small mb-2">Password must be at least 8 characters.</div>`; return; }
  if (DB.findOne('users','Username',username)) { alertEl.innerHTML = `<div class="alert alert-danger py-2 small mb-2">Username already exists.</div>`; return; }

  const empId = Utils.generateId('EMP');
  DB.append('employees', {Employee_ID:empId, Name:name, Designation:desig, Email:email, Phone:phone, Joining_Date:joinDate, Photo_URL:photo, Status:'Active'});
  // Create the user without any password, then set the hash server-side so the
  // cleartext password is never stored in localStorage or the sync queue.
  DB.append('users', {User_ID:Utils.generateId('USR'), Username:username, Designation:desig, Employee_ID:empId, Email:email, Name:name});
  await API.flush();                                   // make sure the user row reaches the server first
  const r = await API.setPassword(username, password); // admin reset (no current password required)
  setFlash(r && r.ok ? 'success' : 'warning',
    r && r.ok ? `Employee ${name} added successfully.`
              : `Employee ${name} added, but setting the password failed (${(r && r.error) || 'server offline'}). Use Reset Password.`);
  bootstrap.Modal.getInstance(document.getElementById('addEmpModal'))?.hide();
  location.reload();
}

// ── Employee profile: full details + admin edit (incl. On Leave status) ──
function openProfile(empId) {
  const emp   = DB.findOne('employees', 'Employee_ID', empId);
  if (!emp) return;
  const user  = DB.findOne('users', 'Employee_ID', empId);
  const tasks = DB.findMany('tasks', 'Employee_ID', empId);
  const stats = Utils.employeeStats(tasks, empId);
  const ini   = Utils.initials(emp.Name);
  const desigOpts = DESIGNATIONS.filter(d => d !== 'CEO')
    .map(d => `<option value="${Utils.esc(d)}" ${emp.Designation===d?'selected':''}>${Utils.esc(d)}</option>`).join('');

  document.getElementById('empProfileBody').innerHTML = `
    <div class="d-flex align-items-center gap-3 mb-3">
      ${emp.Photo_URL ? `<img src="${Utils.esc(emp.Photo_URL)}" class="rounded-circle" width="72" height="72" style="object-fit:cover;border:3px solid var(--glass-bd2)">` : `<div class="emp-avatar-initials" style="width:72px;height:72px;font-size:1.4rem">${Utils.esc(ini)}</div>`}
      <div>
        <div class="fw-700 fs-5">${Utils.esc(emp.Name)} ${Utils.leaveBadge(emp)}</div>
        <div class="text-muted">${Utils.esc(emp.Designation)}</div>
        <div class="text-muted small">ID: <code>${Utils.esc(emp.Employee_ID)}</code>${user?` · Login: <code>${Utils.esc(user.Username)}</code>`:''}</div>
        <div class="text-muted small"><i class="bi bi-calendar-check me-1"></i>Joined: ${Utils.esc(Utils.formatDate(emp.Joining_Date))}</div>
      </div>
    </div>
    <div class="row g-2 text-center mb-3">
      <div class="col-3"><div class="fw-700 text-primary">${stats.total}</div><div class="text-muted" style="font-size:.72rem">Total Tasks</div></div>
      <div class="col-3"><div class="fw-700 text-success">${stats.completed}</div><div class="text-muted" style="font-size:.72rem">Completed</div></div>
      <div class="col-3"><div class="fw-700 text-warning">${stats.pending}</div><div class="text-muted" style="font-size:.72rem">Pending</div></div>
      <div class="col-3"><div class="fw-700 text-danger">${stats.overdue}</div><div class="text-muted" style="font-size:.72rem">Overdue</div></div>
    </div>
    <hr>
    <div id="profAlert"></div>
    <div class="row g-3">
      <div class="col-md-6"><label class="form-label small fw-500">Full Name</label><input type="text" class="form-control" id="profName" value="${Utils.esc(emp.Name)}"></div>
      <div class="col-md-6"><label class="form-label small fw-500">Designation</label><select class="form-select" id="profDesig">${desigOpts}</select></div>
      <div class="col-md-6"><label class="form-label small fw-500">Email</label><input type="email" class="form-control" id="profEmail" value="${Utils.esc(emp.Email||'')}"></div>
      <div class="col-md-6"><label class="form-label small fw-500">Phone</label><input type="tel" class="form-control" id="profPhone" value="${Utils.esc(emp.Phone||'')}"></div>
      <div class="col-md-6"><label class="form-label small fw-500">Date of Joining</label><input type="date" class="form-control" id="profJoinDate" value="${Utils.esc((emp.Joining_Date||'').slice(0,10))}"></div>
      <div class="col-12">
        <label class="form-label small fw-500">Profile Picture</label>
        <div class="d-flex align-items-center gap-3">
          <img id="profPhotoPreview" src="${Utils.esc(emp.Photo_URL||'')}" alt="" class="rounded-circle" width="56" height="56" style="object-fit:cover;border:2px solid var(--glass-bd2);${emp.Photo_URL?'':'display:none'}">
          <div class="flex-fill">
            <input type="file" accept="image/*" class="form-control form-control-sm mb-2" id="profPhotoFile" onchange="pickPhoto('profPhotoFile','profPhotoPreview','profPhotoData','profPhoto')">
            <input type="url" class="form-control form-control-sm" id="profPhoto" value="${(emp.Photo_URL||'').startsWith('data:')?'':Utils.esc(emp.Photo_URL||'')}" placeholder="…or paste an image URL" oninput="document.getElementById('profPhotoData').value=''">
          </div>
        </div>
        <input type="hidden" id="profPhotoData" value="${Utils.esc(emp.Photo_URL||'')}">
      </div>
      <div class="col-md-6">
        <label class="form-label small fw-500">Availability</label>
        <select class="form-select" id="profStatus">
          <option value="Active" ${emp.Status!=='On Leave'?'selected':''}>Active</option>
          <option value="On Leave" ${emp.Status==='On Leave'?'selected':''}>On Leave</option>
        </select>
      </div>
    </div>
    <div class="d-flex justify-content-end gap-2 mt-3">
      <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button>
      <button type="button" class="btn btn-primary" onclick="saveProfile('${Utils.esc(empId)}')"><i class="bi bi-save me-1"></i>Save Changes</button>
    </div>`;
  new bootstrap.Modal(document.getElementById('empProfileModal')).show();
}

async function saveProfile(empId) {
  const emp     = DB.findOne('employees', 'Employee_ID', empId);
  const alertEl = document.getElementById('profAlert');
  if (!emp) return;
  const name  = document.getElementById('profName').value.trim();
  const desig = document.getElementById('profDesig').value;
  const email = document.getElementById('profEmail').value.trim();
  const phone = document.getElementById('profPhone').value.trim();
  const join  = document.getElementById('profJoinDate').value;
  const photo = document.getElementById('profPhotoData').value || document.getElementById('profPhoto').value.trim();
  const stat  = document.getElementById('profStatus').value;
  if (!name || !email) { alertEl.innerHTML = `<div class="alert alert-danger py-2 small mb-2">Name and email are required.</div>`; return; }

  DB.updateById('employees', 'Employee_ID', empId, {Name:name, Designation:desig, Email:email, Phone:phone, Joining_Date:join, Photo_URL:photo, Status:stat});
  // Keep the login record in step so the sidebar/session shows the same details.
  const user = DB.findOne('users', 'Employee_ID', empId);
  if (user) DB.updateById('users', 'User_ID', user.User_ID, {Name:name, Designation:desig, Email:email});

  setFlash('success', `Profile of ${name} updated${stat==='On Leave'?' — marked On Leave':''}.`);
  bootstrap.Modal.getInstance(document.getElementById('empProfileModal'))?.hide();
  await API.flush();
  location.reload();
}

function openResetPwd(userId, empName) {
  _resetUserId = userId;
  document.getElementById('resetEmpName').textContent = empName;
  document.getElementById('resetNewPwd').value = '';
  document.getElementById('resetPwdAlert').innerHTML = '';
  new bootstrap.Modal(document.getElementById('resetPwdModal')).show();
}

async function doResetPwd() {
  const newPwd  = document.getElementById('resetNewPwd').value;
  const alertEl = document.getElementById('resetPwdAlert');
  if (!newPwd || newPwd.length < 8) { alertEl.innerHTML = `<div class="alert alert-danger py-2 small mb-2">Password must be at least 8 characters.</div>`; return; }
  const u = DB.findOne('users', 'User_ID', _resetUserId);
  if (!u) { alertEl.innerHTML = `<div class="alert alert-danger py-2 small mb-2">User not found.</div>`; return; }
  const r = await API.setPassword(u.Username, newPwd);   // admin reset, hashed server-side
  if (!r || !r.ok) { alertEl.innerHTML = `<div class="alert alert-danger py-2 small mb-2">${(r && r.error) || 'Could not reset password (server offline).'}</div>`; return; }
  setFlash('success', 'Password reset successfully.');
  bootstrap.Modal.getInstance(document.getElementById('resetPwdModal'))?.hide();
  location.reload();
}
</script>
</body>
</html>
