<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports — ME-RIISE FOUNDATION</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link href="../assets/css/style.css" rel="stylesheet">
</head>
<body>
<div class="tbi-wrapper">
  <div id="sidebarContainer"></div>
  <div class="tbi-main-wrap">
    <div id="topbarContainer"></div>
    <main class="tbi-content" id="pageContent"></main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.7.1/dist/jspdf.plugin.autotable.min.js"></script>
<script src="../assets/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  await TBI.ready();
  if (!renderShell('Reports', true)) return;
  TBI.autoReloadOnSync();   // refresh when another dashboard changes the data

  const params       = getParams();
  const reportType   = params.get('type')     || 'daily';
  const fEmployee    = params.get('employee') || '';
  const today        = Utils.today();
  const monthStart   = today.slice(0,8)+'01';
  const fFrom        = params.get('from')     || monthStart;
  const fTo          = params.get('to')       || today;

  const tasks     = DB.getAll('tasks');
  const allEmployees = DB.getAll('employees');
  const employees = staffOnly(allEmployees);              // the CEO is the head/admin, not reported as staff
  const session   = Auth.getSession();
  const empMap    = Object.fromEntries(allEmployees.map(e => [e.Employee_ID, e]));

  // Date range for auto types
  function getRange(type) {
    const now = new Date(); now.setHours(0,0,0,0);
    if (type==='daily')   { const d=Utils.today(); return {from:d,to:d}; }
    if (type==='weekly')  { const d=new Date(now); d.setDate(d.getDate()-d.getDay()); return {from:d.toISOString().split('T')[0],to:Utils.today()}; }
    if (type==='monthly') { const d=Utils.today().slice(0,8)+'01'; return {from:d,to:Utils.today()}; }
    return {from:fFrom,to:fTo};
  }
  const range = (reportType==='custom'||reportType==='pending'||reportType==='employee') ? {from:fFrom,to:fTo} : getRange(reportType);

  let filtered = tasks.filter(t => {
    const date = (t.Assigned_Date||'').slice(0,10);
    if (range.from && date < range.from) return false;
    if (range.to   && date > range.to)   return false;
    if (fEmployee && t.Employee_ID !== fEmployee) return false;
    return true;
  });
  if (reportType==='pending') filtered = filtered.filter(t => ['Pending','In Progress'].includes(t.Status));

  const periodLabels = {
    daily: 'Daily Report — ' + new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}),
    weekly: 'Weekly Report',
    monthly: 'Monthly Report — ' + new Date().toLocaleDateString('en-US',{month:'long',year:'numeric'}),
    custom: `Custom Report: ${fFrom} to ${fTo}`,
    pending: 'Pending Task Report',
    employee: 'Employee Productivity Report',
  };
  const periodLabel = periodLabels[reportType]||'Report';

  const types = {daily:'Daily',weekly:'Weekly',monthly:'Monthly',custom:'Custom Range',pending:'Pending Tasks',employee:'Employee Productivity'};
  const typeTabs = Object.entries(types).map(([k,v]) =>
    `<a href="?type=${k}&employee=${encodeURIComponent(fEmployee)}&from=${fFrom}&to=${fTo}" class="btn btn-sm ${reportType===k?'btn-primary':'btn-outline-secondary'}">${v}</a>`
  ).join('');

  const empOptions = employees.map(e =>
    `<option value="${Utils.esc(e.Employee_ID)}" ${fEmployee===e.Employee_ID?'selected':''}>${Utils.esc(e.Name)}</option>`
  ).join('');

  const rTotal    = filtered.length;
  const rApproved = filtered.filter(t=>t.Status==='Approved').length;
  const rCompleted= filtered.filter(t=>['Completed','Approved'].includes(t.Status)).length;
  const rPending  = filtered.filter(t=>['Pending','In Progress'].includes(t.Status)).length;
  const rOverdue  = filtered.filter(t=>Utils.isOverdue(t.Deadline,t.Status)).length;
  const rComplRate= rTotal>0?Math.round((rCompleted/rTotal)*100):0;

  const empProdRows = reportType==='employee' ? employees.map(emp => {
    const s = Utils.employeeStats(filtered, emp.Employee_ID);
    return `<tr>
      <td class="fw-500">${Utils.esc(emp.Name)}</td>
      <td>${Utils.esc(emp.Designation)}</td>
      <td>${s.total}</td>
      <td class="text-success">${s.completed}</td>
      <td class="text-success fw-600">${s.approved}</td>
      <td class="text-warning">${s.pending}</td>
      <td class="${s.overdue>0?'text-danger fw-600':''}">${s.overdue}</td>
      <td>${s.completionPct}%</td>
    </tr>`;
  }).join('') : '';

  const taskRows = filtered.length ? filtered.map((t,i) => {
    const emp = empMap[t.Employee_ID];
    const od  = Utils.isOverdue(t.Deadline,t.Status);
    return `<tr class="${od?'table-danger':''}">
      <td>${i+1}</td>
      <td>${Utils.esc(t.Task_Title)}</td>
      <td>${Utils.esc(emp?.Name||(t.Employee_ID||''))}</td>
      <td>${Utils.esc(t.Priority)}</td>
      <td>${Utils.formatDate(t.Assigned_Date)}</td>
      <td>${Utils.formatDate(t.Deadline)}</td>
      <td>${od?Utils.daysPending(t.Deadline)+'d':'—'}</td>
      <td>${Utils.esc(t.Status)}</td>
      <td>${Utils.esc(t.Assigned_By||'')}</td>
    </tr>`;
  }).join('') : `<tr><td colspan="9" class="text-center text-muted py-3">No data for selected period</td></tr>`;

  const empProdSection = reportType==='employee' ? `
    <h6 class="fw-600 mb-3">Employee Productivity Summary</h6>
    <div class="table-responsive mb-4">
      <table class="table table-bordered table-sm" id="reportTable">
        <thead class="table-primary"><tr><th>Employee</th><th>Designation</th><th>Total</th><th>Completed</th><th>Approved</th><th>Pending</th><th>Overdue</th><th>Completion %</th></tr></thead>
        <tbody>${empProdRows}</tbody>
      </table>
    </div>` : '';

  const detailTableId = reportType==='employee' ? 'detailTable' : 'reportTable';

  document.getElementById('pageContent').innerHTML = `
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
      <h4 class="fw-700 mb-0"><i class="bi bi-file-earmark-bar-graph me-2 text-primary"></i>Reports</h4>
      <div class="d-flex gap-2 align-items-center">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="exportActionsToggle" checked>
          <label class="form-check-label small" for="exportActionsToggle">Include Actions</label>
        </div>
        <button class="btn btn-outline-success" onclick="exportTableExcel('reportTable','ME-RIISE_FOUNDATION_Report_${reportType}')"><i class="bi bi-file-earmark-excel me-1"></i>Excel</button>
        <button class="btn btn-outline-danger" onclick="exportTablePDF('reportTable','${Utils.esc(periodLabel)}')"><i class="bi bi-file-earmark-pdf me-1"></i>PDF</button>
        <button class="btn btn-outline-secondary" onclick="window.print()"><i class="bi bi-printer me-1"></i>Print</button>
      </div>
    </div>

    <div class="card border-0 shadow-sm mb-4">
      <div class="card-body">
        <div class="d-flex flex-wrap gap-2 mb-3">${typeTabs}</div>
        <form id="filterForm" class="row g-2 align-items-end">
          <input type="hidden" name="type" value="${reportType}">
          <div class="col-auto">
            <label class="form-label small">Employee</label>
            <select class="form-select form-select-sm" id="empSelect">
              <option value="">All Employees</option>${empOptions}
            </select>
          </div>
          <div class="col-auto">
            <label class="form-label small">From</label>
            <input type="date" class="form-control form-control-sm" id="fromDate" value="${Utils.esc(fFrom)}">
          </div>
          <div class="col-auto">
            <label class="form-label small">To</label>
            <input type="date" class="form-control form-control-sm" id="toDate" value="${Utils.esc(fTo)}">
          </div>
          <div class="col-auto">
            <button type="button" class="btn btn-sm btn-primary" onclick="applyFilter()">Apply</button>
          </div>
        </form>
      </div>
    </div>

    <div class="card border-0 shadow-sm mb-3">
      <div class="card-body">
        <div class="text-center mb-4 d-none d-print-block">
          <h4>ME-RIISE FOUNDATION</h4>
          <h6 class="text-muted">Technology Business Incubator – MCE Hassan</h6>
          <h5>${Utils.esc(periodLabel)}</h5>
          <p class="text-muted small">Generated on ${new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})} by ${Utils.esc(session.name)}</p>
        </div>
        <div class="row g-3 mb-4">
          <div class="col-6 col-md-2 text-center"><div class="fw-700 fs-4 text-primary">${rTotal}</div><div class="small text-muted">Total Tasks</div></div>
          <div class="col-6 col-md-2 text-center"><div class="fw-700 fs-4 text-success">${rApproved}</div><div class="small text-muted">Approved</div></div>
          <div class="col-6 col-md-2 text-center"><div class="fw-700 fs-4 text-info">${rCompleted}</div><div class="small text-muted">Completed</div></div>
          <div class="col-6 col-md-2 text-center"><div class="fw-700 fs-4 text-warning">${rPending}</div><div class="small text-muted">Pending</div></div>
          <div class="col-6 col-md-2 text-center"><div class="fw-700 fs-4 text-danger">${rOverdue}</div><div class="small text-muted">Overdue</div></div>
          <div class="col-6 col-md-2 text-center"><div class="fw-700 fs-4 text-purple">${rComplRate}%</div><div class="small text-muted">Completion Rate</div></div>
        </div>
        ${empProdSection}
        <h6 class="fw-600 mb-3">Task Details (${filtered.length} tasks)</h6>
        <div class="table-responsive">
          <table class="table table-bordered table-sm" id="${detailTableId}">
            <thead class="table-primary"><tr><th>#</th><th>Task</th><th>Employee</th><th>Priority</th><th>Assigned</th><th>Deadline</th><th>Days Overdue</th><th>Status</th><th>Assigned By</th></tr></thead>
            <tbody>${taskRows}</tbody>
          </table>
        </div>
      </div>
    </div>
  `;
});

function applyFilter() {
  const emp  = document.getElementById('empSelect').value;
  const from = document.getElementById('fromDate').value;
  const to   = document.getElementById('toDate').value;
  const type = getParams().get('type')||'daily';
  window.location.href = `reports.html?type=${type}&employee=${encodeURIComponent(emp)}&from=${from}&to=${to}`;
}
</script>
</body>
</html>
